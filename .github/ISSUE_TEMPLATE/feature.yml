name: Feature request
description: Suggest something Redline could do that it doesn't.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Redline is intentionally narrow — single-player, single-agent, local markdown review with a Claude in the thread. Feature requests that fit that scope are more likely to land than ones that pull it toward being a full CMS or collaborative-editing platform.

        Read [ROADMAP.md](https://github.com/alevi/redline/blob/main/ROADMAP.md) first to see what's already planned. If your idea is already on it, drop a 👍 on this issue when you open it.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Redline doesn't currently support? Describe the situation, not the solution.
      placeholder: |
        e.g. "When I revise a doc across multiple rounds, I lose track of which comments from earlier rounds led to which paragraphs in the current version."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd want it to do
      description: One specific behavior change or new affordance. Worked-through ideas land better than open-ended brainstorms.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: Worked around it? Different tool? Manual process? This tells us how much friction the current state actually causes.
    validations:
      required: false

  - type: textarea
    id: scope-fit
    attributes:
      label: How this fits Redline's scope
      description: |
        Redline is local-first, single-player, single-agent, markdown-only. Briefly note how your idea sits inside those constraints, or argue for moving one of them.
    validations:
      required: false
