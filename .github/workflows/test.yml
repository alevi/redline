name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The cli's preflight check requires a `claude` executable on PATH (or
      # CLAUDE_CODE_EXECPATH set to an existing file). Tests that drive real
      # agent calls install their own shim; the rest just need the preflight to
      # pass. Drop a no-op `claude` on PATH so neither set blocks CI.
      - run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: bun test
